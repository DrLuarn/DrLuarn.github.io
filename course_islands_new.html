<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pforzheim AI Course Islands · by Prof Luarn</title>
<meta name="description" content="An interactive 3D map of the Pforzheim AI Course: six floating islands, six units.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1. THEME VARIABLES  (edit colours / fonts here)
   ===================================================================== */
:root {
  --ink: #2b3350;            /* main text */
  --ink-soft: #586084;       /* secondary text */
  --paper: rgba(255,255,255,.98);
  --line: #dfe3f3;
  --accent: #4a56a6;         /* primary buttons */
  --accent-ink: #ffffff;
  --focus: #3347d1;
  --sky: linear-gradient(180deg,#a9bdf0 0%,#cfc8f5 42%,#f6d7e8 78%,#fde9dc 100%);
  --island: #9fe0c0;         /* set per island when a panel opens */
  --hdr: 76px;               /* header height, measured by JS */
  --radius: 18px;
  --font: "Nunito","Varela Round",ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",
          Quicksand,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
/* Low-stimulation palette: calmer, flatter, bigger text */
body.low-stim {
  --sky: #eef0f6;
  --accent: #56608a;
  --ink-soft: #4d5578;
  --paper: #ffffff;
  font-size: 18px;
  line-height: 1.8;
  letter-spacing: .02em;
}
/* Kill every transition/animation in low-stim mode and for reduced-motion users */
body.low-stim *, body.low-stim *::before, body.low-stim *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* =====================================================================
   2. BASE
   ===================================================================== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); font-size: 17px; line-height: 1.6; color: var(--ink);
  overflow: hidden; -webkit-text-size-adjust: 100%;
}
.sky { position: fixed; inset: 0; background: var(--sky); z-index: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }

.skip-link {
  position: fixed; left: 12px; top: -80px; z-index: 100; background: #fff; color: var(--ink);
  padding: 10px 16px; border-radius: 12px; border: 2px solid var(--focus); font-weight: 700;
}
.skip-link:focus { top: 12px; }

/* =====================================================================
   3. HEADER + BUTTONS
   ===================================================================== */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px;
  padding: 10px 16px; background: rgba(255,255,255,.78);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,.7); box-shadow: 0 6px 24px rgba(70,80,140,.10);
}
h1 { margin: 0; font-size: clamp(1.15rem, 2.6vw, 1.55rem); font-weight: 800; line-height: 1.2; }
h1 .by { font-size: .62em; font-weight: 600; color: #6b7499; margin-left: .4em; white-space: nowrap; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.music { display: inline-flex; align-items: center; gap: 8px; }
.btn {
  border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
  padding: 7px 14px; font-weight: 700; font-size: .92rem; line-height: 1.3; min-height: 40px;
  transition: background .25s, border-color .25s;
}
.btn:hover:not(:disabled) { background: #f1f3ff; border-color: #c9d0f0; }
.btn[aria-pressed="true"] { background: #e7ebff; border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: #3b4690; }
.btn.small { padding: 4px 12px; min-height: 34px; font-size: .85rem; }
input[type=range] { width: 96px; accent-color: var(--accent); height: 28px; }
.switch { display: inline-flex; align-items: center; gap: 9px; }
.switch .track { width: 40px; height: 22px; border-radius: 12px; background: #b9bfd9; position: relative; flex: none; transition: background .3s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s; }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(18px); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 1.05rem; font-weight: 800; flex: none; }
.icon-btn:hover { background: #f1f3ff; }

/* =====================================================================
   4. 3D STAGE + LABELS
   ===================================================================== */
#stage { position: fixed; inset: 0; z-index: 1; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#c:active { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.island-label {
  position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: 0; padding: 0; margin: 0;
}
.island-label .ltr {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.94); color: var(--ink); font-weight: 800; font-size: 1.35rem;
  border: 3px solid var(--c, #fff); box-shadow: 0 6px 16px rgba(60,70,130,.22);
  transition: transform .35s, box-shadow .35s;
}
.island-label .cap {
  background: rgba(255,255,255,.95); color: var(--ink); border-radius: 999px; padding: 1px 10px;
  font-size: .8rem; font-weight: 700; opacity: 0; transform: translateY(-4px);
  transition: opacity .35s, transform .35s; pointer-events: none; white-space: nowrap;
}
.island-label.hl .ltr, .island-label:focus-visible .ltr { transform: scale(1.12); box-shadow: 0 0 0 5px rgba(255,255,255,.65), 0 8px 22px rgba(60,70,130,.3); }
.island-label.hl .cap, .island-label:focus-visible .cap { opacity: 1; transform: none; }
.island-label:focus-visible { outline: none; }
.island-label:focus-visible .ltr { outline: 3px solid var(--focus); outline-offset: 3px; }
#loading, .fallback { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; background: var(--paper); padding: 18px 24px; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(60,70,130,.18); max-width: min(92vw, 460px); }
.hint {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: rgba(43,51,80,.9); color: #fff; padding: 10px 14px 10px 18px; border-radius: 999px;
  display: flex; align-items: center; gap: 10px; max-width: 92vw; font-weight: 600; font-size: .95rem;
  transition: opacity 1.2s; z-index: 6;
}
.hint.fade { opacity: 0; }
.hint button { background: rgba(255,255,255,.2); border: 0; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-weight: 800; }

/* =====================================================================
   5. SIDE PANEL (bottom sheet on phones)
   ===================================================================== */
.panel {
  position: fixed; z-index: 20; top: calc(var(--hdr) + 10px); right: 12px; bottom: 12px;
  width: min(440px, 42vw); display: flex; flex-direction: column;
  background: var(--paper); border-radius: 24px; box-shadow: 0 16px 48px rgba(50,60,120,.28);
  border: 3px solid var(--island);
  transform: translateX(110%); visibility: hidden;
  transition: transform .55s cubic-bezier(.3,.7,.2,1), visibility 0s .55s;
}
.panel.open { transform: none; visibility: visible; transition: transform .55s cubic-bezier(.3,.7,.2,1), visibility 0s; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px 16px; border-bottom: 1px solid var(--line); }
.badge { width: 50px; height: 50px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; background: var(--island); color: var(--ink); box-shadow: inset 0 -4px 0 rgba(0,0,0,.06); }
.ph-text { flex: 1; min-width: 0; }
.eyebrow { margin: 0; font-size: .82rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.panel h2 { margin: 0; font-size: 1.2rem; line-height: 1.25; }
.panel h2:focus { outline: none; }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 18px 18px; overscroll-behavior: contain; }
.panel-body h3 { margin: 20px 0 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
.panel-body p { margin: 0 0 10px; }
.panel-foot { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
ol.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ol.lessons li { display: flex; gap: 10px; background: #f7f8ff; border-radius: 14px; padding: 9px 12px; border-left: 6px solid var(--island); }
ol.lessons .num { font-weight: 800; color: var(--ink-soft); min-width: 2.2em; }
ol.lessons strong { display: block; line-height: 1.3; }
ol.lessons .desc { display: block; color: var(--ink-soft); font-size: .92rem; margin-top: 2px; }

@media (max-width: 820px) {
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: min(46vh, 460px); transform: translateY(115%); }
  .panel.open { transform: none; }
  .panel-foot .btn { font-size: .85rem; padding: 6px 10px; }
  .hint { bottom: 14px; font-size: .88rem; }
}
@media (max-width: 520px) { .btn { padding: 6px 11px; font-size: .85rem; min-height: 38px; } input[type=range] { width: 72px; } }

/* =====================================================================
   6. TEXT-ONLY VIEW ("Skip 3D view") and WebGL fallback
   ===================================================================== */
body.text-mode #stage { display: none; }
#textView { position: fixed; inset: 0; z-index: 10; overflow-y: auto; padding: calc(var(--hdr) + 18px) 18px 40px; }
body.panel-open.text-mode #textView { padding-right: min(460px, 44vw); }
@media (max-width: 820px) { body.panel-open.text-mode #textView { padding-right: 18px; padding-bottom: 60vh; } }
#textView .wrap { max-width: 920px; margin: 0 auto; }
#textView h2 { margin: 0 0 6px; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; margin-top: 14px; }
.tcard { background: var(--paper); border-radius: var(--radius); padding: 14px 16px; border-top: 8px solid var(--c); box-shadow: 0 6px 20px rgba(60,70,130,.12); }
.tcard h3 { margin: 0 0 6px; font-size: 1.05rem; line-height: 1.3; }
.tcard ul { margin: 6px 0 12px; padding-left: 1.2em; color: var(--ink-soft); font-size: .93rem; }

/* =====================================================================
   7. ACTIVITIES
   ===================================================================== */
.act { background: #f3f5ff; border-radius: 16px; padding: 12px; }
.lead { color: var(--ink-soft); font-size: .95rem; margin: 0 0 10px; }
.feedback { min-height: 1.6em; font-weight: 700; margin: 8px 0 0; }
.feedback.good { color: #1e7a52; }
.feedback.try { color: #8a4f12; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.col { display: grid; gap: 8px; align-content: start; }
.chip {
  display: block; width: 100%; text-align: left; border: 2px solid #d4daf3; background: #fff; border-radius: 14px;
  padding: 9px 12px; font-weight: 700; font-size: .93rem; line-height: 1.35; transition: background .25s, border-color .25s;
}
.chip:hover:not(:disabled) { background: #eef0ff; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: #e4e8ff; }
.chip.ok { background: #dff6e9; border-color: #6fc79a; }
.chip.wrong { background: #fff0e0; border-color: #efb27a; }
.chip:disabled { cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.progress { font-size: .85rem; font-weight: 800; color: var(--ink-soft); margin: 0 0 6px; }
.slots { display: grid; gap: 6px; margin: 8px 0; }
.slot { min-height: 52px; border: 2px dashed #b9c1e6; border-radius: 14px; padding: 4px; display: flex; flex-direction: column; justify-content: center; }
.slot .sl { font-size: .74rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; padding: 0 8px; }
.pool { display: grid; gap: 6px; }
label.field { display: block; font-weight: 700; margin: 8px 0 4px; }
select, textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); border: 2px solid #d4daf3; border-radius: 12px; padding: 8px 10px; background: #fff; }
textarea { min-height: 70px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 10px 0 0; }
legend { font-weight: 700; padding: 0; margin-bottom: 4px; }
.check { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: #fff; border: 2px solid #d4daf3; border-radius: 12px; margin-bottom: 6px; font-weight: 700; font-size: .93rem; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.summary { background: #fff; border-radius: 14px; padding: 10px 12px; margin-top: 10px; border-left: 6px solid var(--island); }
.flipgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.flip { perspective: 800px; height: 128px; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform .8s ease; transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.face.front { background: linear-gradient(160deg, #fff, #eef0ff); border: 2px solid #d4daf3; }
.face.back { background: #fff8e8; border: 2px solid #f0d9a8; transform: rotateY(180deg); font-size: .85rem; }
.face.front button { background: none; border: 0; width: 100%; height: 100%; font-weight: 800; font-size: 1rem; line-height: 1.3; }
.face.front small { display: block; font-weight: 600; color: var(--ink-soft); font-size: .76rem; }
.face.back p { margin: 0; font-size: .82rem; line-height: 1.3; }
.compare { margin-top: 12px; }
.quote { font-style: italic; }

/* tiny screens: stack two-column activities */
@media (max-width: 420px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>

<body>
<a class="skip-link" href="#textView" id="skipLink">Skip 3D view and open the text list of islands</a>
<div class="sky" id="sky" aria-hidden="true"></div>

<header id="topbar">
  <h1>Pforzheim AI Course Islands <span class="by">by Prof Luarn</span></h1>
  <div class="toolbar" role="toolbar" aria-label="Page controls">
    <button id="btnOverview" class="btn" type="button" aria-label="Back to overview">⌂ Back to overview</button>
    <div class="music" role="group" aria-label="Background music">
      <button id="btnMusic" class="btn" type="button" aria-pressed="false">♪ Music: off</button>
      <label class="sr" for="vol">Music volume</label>
      <input id="vol" type="range" min="0" max="100" value="35" aria-label="Music volume">
    </div>
    <button id="btnLow" class="btn switch" type="button" role="switch" aria-checked="false">
      <span class="track" aria-hidden="true"></span><span>Low-stimulation mode</span>
    </button>
    <button id="btnText" class="btn" type="button" aria-pressed="false">Skip 3D view</button>
  </div>
</header>

<main id="stage">
  <canvas id="c" role="img" aria-label="3D view of six floating course islands, A to F. Drag to rotate, scroll or pinch to zoom. A text list of islands is available through the Skip 3D view button."></canvas>
  <div id="labels"></div>
  <div id="loading" role="status">Loading the islands…</div>
  <div id="fallback" class="fallback" role="alert" hidden></div>
  <div id="hint" class="hint" role="status" hidden>
    <span>Drag to rotate, scroll to zoom, click an island to explore.</span>
    <button type="button" id="hintClose" aria-label="Dismiss hint">✕</button>
  </div>
</main>

<section id="textView" aria-labelledby="textTitle" hidden>
  <div class="wrap">
    <h2 id="textTitle" tabindex="-1">Text list of islands</h2>
    <p class="lead">Every island, one after the other. Choose “Open” to see the intro, lessons and the small activity.</p>
    <div class="tgrid" id="tgrid"></div>
  </div>
</section>

<aside id="panel" class="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle" aria-hidden="true">
  <div class="panel-head">
    <div class="badge" id="panelBadge" aria-hidden="true">A</div>
    <div class="ph-text">
      <p class="eyebrow" id="panelEyebrow"></p>
      <h2 id="panelTitle" tabindex="-1"></h2>
    </div>
    <button id="btnClose" class="icon-btn" type="button" aria-label="Close this island and return to the overview">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot">
    <button id="btnPrev" class="btn" type="button"></button>
    <button id="btnNext" class="btn" type="button"></button>
  </div>
</aside>

<!-- Three.js + OrbitControls (r128) from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function () {
'use strict';

/* =====================================================================
   A. SMALL HELPERS
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const body = document.body;

/** Tiny DOM builder. el('button', {class:'chip', text:'Hi', onclick:fn}, child, ...) — uses textContent, so it is XSS-safe. */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }

/* =====================================================================
   B. COURSE CONTENT  (edit island names, lessons, colours here)
   ---------------------------------------------------------------------
   color = island top, rock = underside, tree = little trees,
   landmark = which little building to draw (camera | face | robot | gem | windmill | lighthouse)
   ===================================================================== */
const ISLANDS = [
  { id: 'A', unit: 1, title: 'Getting Started with Perceptual AI', color: '#9fe0c0', rock: '#ecd9c6', tree: '#6fc89a', landmark: 'camera',
    intro: 'Welcome aboard! In this unit you meet perceptual AI: programs that can see and recognize things in pictures and video. You will build your own web page, try ready-made tools, and train a model of your own.',
    lessons: [
      ['1.1 Build your own personal web page and course introduction', 'Create a simple web page that introduces you and sets up your space for the course.'],
      ['1.2 Introduction to Google MediaPipe Tasks (perceptual AI)', 'Get to know ready-made tools that let a computer see faces, hands and bodies.'],
      ['1.3 Train your own recognition model with Teachable Machine', 'Show a tool a few examples and teach it to recognize things on its own.'],
      ['1.4 Image object recognition with Google Antigravity', 'Build and try an object recognition project for still images.'],
      ['1.5 Video object recognition with Google Antigravity', 'Take object recognition from still pictures to moving video.'],
    ],
    activity: { type: 'match', title: 'Match the tool to the task', lead: 'Tap a tool on the left, then tap the task it fits best on the right.' } },

  { id: 'B', unit: 2, title: 'MediaPipe Vision Tasks', color: '#f9b8cf', rock: '#ecd5d3', tree: '#8fd6a6', landmark: 'face',
    intro: 'MediaPipe gives your browser ready-made vision skills, from finding faces to tracking hands and bodies. Each lesson explores one task so you can see what it does best. By the end you will know which task fits which idea.',
    lessons: [
      ['2.1 MediaPipe Face Landmark Detection', 'Find and mark key points on a face in a photo.'],
      ['2.2 MediaPipe Video Face Landmark Detection', 'Follow those face points live in a video.'],
      ['2.3 MediaPipe Pose Landmark Detection', 'Track body points such as shoulders, elbows and knees.'],
      ['2.4 MediaPipe Gesture Recognition', 'Recognize hand gestures like a thumbs-up or an open palm.'],
      ['2.5 MediaPipe Image Segmentation', 'Separate parts of an image, for example a person from the background.'],
      ['2.6 MediaPipe Face Detection', 'Find where faces are in an image and draw a box around each one.'],
    ],
    activity: { type: 'quiz', title: 'Which task would you use?', lead: 'Read the idea, then pick the MediaPipe task that fits best.' } },

  { id: 'C', unit: 3, title: 'Real-Time Models and Creative AI', color: '#c2b4f5', rock: '#e3dcef', tree: '#9fd9b4', landmark: 'robot',
    intro: 'Now things go live! You will work with models that respond in real time and try some creative AI, from restyling photos to chatting with an AI model. Then you bring your skills together in a small building project.',
    lessons: [
      ['3.1 Teachable Machine Real-Time Object Classifier', 'Build a classifier that labels what your webcam sees, as it happens.'],
      ['3.2 YOLO', 'Explore YOLO, a well-known family of models for finding objects in images quickly.'],
      ['3.3 Neural Style Transfer', 'Turn a photo into a painting-like image by borrowing the look of an artwork.'],
      ['3.4 Simple Chat App Built with a Gemini API Key', 'Make a simple chat app that talks to a Gemini model using your own API key.'],
      ['3.5 Island Builder', 'Put your new skills together in a creative building project.'],
    ],
    activity: { type: 'order', title: 'Put the pipeline in order', lead: 'Every AI app moves through three steps. Tap the cards in the order they happen.' } },

  { id: 'D', unit: 4, title: 'Gemini and Multimodal Workflows', color: '#9fd3f5', rock: '#d9e3ee', tree: '#8fd9b0', landmark: 'gem',
    intro: 'Here AI works with more than text: pictures, words and ideas together. You will meet multimodal models and explore how Gemini tools can help you organize and create. Think of it as designing your own digital helper.',

/* --- A: match the tool to the task (click one on the left, then one on the right) --- */
function actMatch() {
  const pairs = [

/* --- C: put the pipeline steps in order (input -> model -> output) --- */
function actOrder() {

    { name: 'Simple chat app', steps: ['You type a message', 'The AI model reads it and writes a reply', 'The reply shows up in the chat window'] },

    const slotEls = ['1st', '2nd', '3rd'].map(l => el('div', { class: 'slot' }, el('span', { class: 'sl', text: `${l} step` })));
    const pool = el('div', { class: 'pool' });
    const cards = shuffle(round.steps.map((s, i) => [i, s])).map(([i, s]) => {
      const b = el('button', { class: 'chip', type: 'button', text: s });
      b.dataset.i = i;
      b.addEventListener('click', () => {
        if (b.dataset.locked) return;
        const inSlot = slotEls.find(sl => sl.contains(b));
        if (inSlot) { pool.append(b); fb.textContent = ''; fb.className = 'feedback'; b.focus(); return; }
        const free = slotEls.find(sl => !sl.querySelector('.chip'));
        if (free) { free.append(b); b.focus(); }
        if (slotEls.every(sl => sl.querySelector('.chip'))) check();
      });
      pool.append(b); return b;
    });
    function check() {
      const order = slotEls.map(sl => +sl.querySelector('.chip').dataset.i);
      if (order.join() === '0,1,2') {
        cards.forEach((c, k) => { c.dataset.locked = '1'; c.classList.add('ok'); });
        ['Input', 'Model', 'Output'].forEach((t, k) => { slotEls[k].querySelector('.sl').textContent = t; });
        fb.className = 'feedback good'; fb.textContent = 'Perfect! Input → model → output.';
        next.hidden = false; next.focus();
      } else {
        fb.className = 'feedback try'; fb.textContent = 'Almost! Something goes in first, then the model works, then you see a result. Tap a card to take it back.';
      }
    }
    const next = el('button', { class: 'btn primary small', type: 'button', hidden: true, text: r === R.length - 1 ? 'Play again' : 'Next pipeline', onclick: () => { r = (r + 1) % R.length; render(); } });

}

/* =====================================================================
   D. BACKGROUND MUSIC  (Web Audio: soft pads + slow pentatonic notes; no audio files)
   ===================================================================== */
const Music = (function () {
  let ctx = null, master = null, bus = null, timer = null, on = false, vol = 0.35;
  let nextChord = 0, nextNote = 0, chordIdx = 0, noteIdx = 2;
  // Chords: C, Am, F, G (low, warm voicings). Melody: C major pentatonic.
  const CHORDS = [[130.81, 196.0, 329.63], [110.0, 164.81, 261.63], [87.31, 130.81, 220.0], [98.0, 146.83, 246.94]];
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  const level = () => Math.pow(vol, 1.5) * 0.95;
  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('Web Audio is not supported');
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = 0.3;
    bus = ctx.createGain(); bus.connect(lp); lp.connect(master);
    // soft echo for a dreamy tail
    const send = ctx.createGain(); send.gain.value = 0.45; lp.connect(send);
    const d = ctx.createDelay(2); d.delayTime.value = 0.68;
    const fb = ctx.createGain(); fb.gain.value = 0.4;
    const dl = ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 1200;
    send.connect(d); d.connect(dl); dl.connect(fb); fb.connect(d); dl.connect(master);
  }
  function pad(t) {
    const notes = CHORDS[chordIdx++ % CHORDS.length], dur = 9;
    notes.forEach((f, i) => [-5, 5].forEach(det => {
      const o = ctx.createOscillator(); o.type = i === 2 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = det;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.035, t + 3.5);
      g.gain.setValueAtTime(0.035, t + dur - 1); g.gain.linearRampToValueAtTime(0, t + dur + 3.5);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 3.6);
    }));
  }
  function note(t) {
    noteIdx = clamp(noteIdx + [-2, -1, 0, 1, 2][Math.floor(Math.random() * 5)], 0, PENTA.length - 1);
    const f = PENTA[noteIdx];
    [[f, 0.05], [f * 2, 0.012]].forEach(([fr, amp]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = fr;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.08); g.gain.setTargetAtTime(0, t + 0.12, 0.9);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + 4.5);
    });
  }
  function tick() {
    if (!ctx || !on) return;
    while (nextChord < ctx.currentTime + 2.5) { pad(nextChord); nextChord += 8; }
    while (nextNote < ctx.currentTime + 2.5) { note(nextNote); nextNote += 2.6 + Math.random() * 3.4; }
  }
  return {
    isOn: () => on,
    start() {
      if (on) return; if (!ctx) build();
      ctx.resume(); on = true;
      const t = ctx.currentTime; nextChord = t + 0.1; nextNote = t + 3;
      master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(level(), t + 2.5);
      timer = setInterval(tick, 400); tick();
    },
    stop() {
      if (!on) return; on = false; clearInterval(timer);
      if (ctx) { const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 0.8); }
      setTimeout(() => { if (!on && ctx) { ctx.close().catch(() => {}); ctx = null; } }, 1100);
    },
    setVolume(v) { vol = v; if (ctx && on) master.gain.setTargetAtTime(level(), ctx.currentTime, 0.1); },
  };
})();

/* ---------- Panel rendering ---------- */
function lessonList(d) {
  return el('ol', { class: 'lessons' }, d.lessons.map(([t, desc]) => {
    const [num, title] = splitLesson(t);
    return el('li', {}, el('span', { class: 'num', text: num }), el('div', {}, el('strong', { text: title }), el('span', { class: 'desc', text: desc })));
  }));
}
function renderPanel(d) {
  panel.style.setProperty('--island', d.color);
  $('#panelBadge').textContent = d.id;
  $('#panelEyebrow').textContent = `Island ${d.id} · Unit ${d.unit}`;
  $('#panelTitle').textContent = d.title;
  const pb = $('#panelBody');
  pb.replaceChildren(
    el('p', { text: d.intro }),
    el('h3', { text: `Lessons in Unit ${d.unit}` }), lessonList(d),
    el('h3', { text: 'Try it: ' + d.activity.title }), ACTIVITIES[d.activity.type]());
  pb.scrollTop = 0;
  const i = ISLANDS.indexOf(d), prev = ISLANDS[(i + 5) % 6], next = ISLANDS[(i + 1) % 6];
  $('#btnPrev').textContent = `← Island ${prev.id}`; $('#btnPrev').setAttribute('aria-label', `Go to Island ${prev.id}`); $('#btnPrev').onclick = () => openIsland(prev.id);
  $('#btnNext').textContent = `Island ${next.id} →`; $('#btnNext').setAttribute('aria-label', `Go to Island ${next.id}`); $('#btnNext').onclick = () => openIsland(next.id);
}

function openIsland(id) {
  const d = BY_ID[id]; if (!d) return;
  if (!panel.classList.contains('open')) lastFocus = document.activeElement;
  state.selected = id;
  hideHint();
  renderPanel(d);
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); body.classList.add('panel-open');
  if (webgl && !textMode) webgl.flyToIsland(id);
  setTimeout(() => $('#panelTitle').focus({ preventScroll: true }), lowStim ? 0 : 280);
  if (webgl) webgl.markDirty();
}
function closePanel() {
  const was = state.selected;
  state.selected = null;
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); body.classList.remove('panel-open');
  if (webgl && !textMode) webgl.flyToOverview();
  const back = (webgl && was && webgl.labelFor(was)) || lastFocus;
  if (back && back.focus && !textMode) back.focus({ preventScroll: true });
  else if (textMode && was) { const b = $(`#tgrid [data-open="${was}"]`); if (b) b.focus(); }
  if (webgl) webgl.markDirty();
}
function backToOverview() { if (panel.classList.contains('open')) closePanel(); else if (webgl && !textMode) webgl.flyToOverview(); }

/* ---------- Text-only list ("Skip 3D view") ---------- */
function buildTextList() {
  const g = $('#tgrid'); g.replaceChildren();
  ISLANDS.forEach(d => {
    g.append(el('article', { class: 'tcard', style: `--c:${d.color}`, 'aria-labelledby': 'tt' + d.id },
      el('h3', { id: 'tt' + d.id, text: `Island ${d.id} · Unit ${d.unit}: ${d.title}` }),
      el('ul', {}, d.lessons.map(l => el('li', { text: l[0] }))),
      el('button', { class: 'btn primary small', type: 'button', 'data-open': d.id, 'aria-label': `Open Island ${d.id}: ${d.title}`, text: `Open Island ${d.id}`, onclick: () => openIsland(d.id) })));
  });
}
function setTextMode(on, { focus = true, silent = false } = {}) {
  textMode = on;
  body.classList.toggle('text-mode', on);
  $('#textView').hidden = !on;
  const b = $('#btnText'); b.textContent = on ? 'Back to 3D view' : 'Skip 3D view'; b.setAttribute('aria-pressed', String(on));
  if (on) { if (!silent && panel.classList.contains('open')) { /* keep panel open */ } if (focus) $('#textTitle').focus({ preventScroll: true }); }
  else if (webgl) { webgl.resize(); webgl.markDirty(); }
  $('#btnOverview').disabled = on && !panel.classList.contains('open');
}

/* ---------- Low-stimulation mode + music ---------- */
function syncMusic() {
  const b = $('#btnMusic'), v = $('#vol');
  const effective = musicWanted && !lowStim;
  try {
    if (effective && !Music.isOn()) Music.start();
    else if (!effective && Music.isOn()) Music.stop();
  } catch (e) { musicWanted = false; b.textContent = '♪ Music unavailable'; b.disabled = true; return; }
  b.disabled = lowStim; v.disabled = lowStim;
  b.setAttribute('aria-pressed', String(effective));
  b.textContent = lowStim ? '♪ Music: off (calm mode)' : (effective ? '♪ Music: on' : '♪ Music: off');
  b.title = lowStim ? 'Music is switched off in Low-stimulation mode' : '';
}
function setLowStim(on, user) {
  lowStim = on; body.classList.toggle('low-stim', on);
  const b = $('#btnLow'); b.setAttribute('aria-checked', String(on));
  if (user) store('pf_low', on ? '1' : '0');
  syncMusic();
  if (webgl) webgl.applyMode();
}

  /* ----- camera, fly-to and layout ----- */

  const markDirty = () => { dirty = true; };
  function computeOvDist() {

    const dist = clamp(Math.max(4.4 / (f.fh * 2 * t), 4.6 / (f.fw * 2 * t * camera.aspect)), 8, 24);
    const tg = c.clone().add(new THREE.Vector3(0, 0.9, 0)), pitch = 0.38;
    const p = tg.clone().addScaledVector(out, dist * Math.cos(pitch)).add(new THREE.Vector3(0, dist * Math.sin(pitch), 0));
    atOverview = false; flyTo(p, tg, 1.0);
  }
  function flyToOverview() { atOverview = true; flyTo(ovPos(), OV_TARGET, 1.2); }
  const cancelTween = () => { tween = null; };
  canvas.addEventListener('wheel', cancelTween, { passive: true });
  controls.addEventListener('start', () => { atOverview = false; hideHint(); });
  controls.addEventListener('change', markDirty);

  /* ----- picking: hover (mouse) and click/tap ----- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(ev) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const h = ray.intersectObjects(hitMeshes, false);
    return h.length ? h[0].object.userData.obj : null;
  }
  let down = null, hoverQueued = false;
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; cancelTween(); hideHint(); });
  canvas.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
    if (moved < 7 && dt < 700) { const o = pick(e); if (o) openIsland(o.d.id); }
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || e.buttons) return;
    if (hoverQueued) return; hoverQueued = true;
    requestAnimationFrame(() => { hoverQueued = false; const o = pick(e); const id = o ? o.d.id : null; if (id !== state.hovered) { state.hovered = id; canvas.style.cursor = id ? 'pointer' : ''; markDirty(); } });
  });
  canvas.addEventListener('pointerleave', () => { if (state.hovered) { state.hovered = null; canvas.style.cursor = ''; markDirty(); } });
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); showFallback('The 3D view stopped working (the graphics context was lost). You can still explore every island from the text list.'); });

  /* ----- sizing (pixel ratio capped for speed) ----- */
  let W = 1, H = 1;
  function resize() {
    W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, W < 700 ? 1.5 : 2));
    renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
    computeOvDist();
    if (atOverview && !tween && !state.selected) { camera.position.copy(ovPos()); controls.target.copy(OV_TARGET); controls.update(); }
    markDirty();
  }
  window.addEventListener('resize', resize);

  /* ----- low-stim / palette ----- */
  const hsl = {};
  function applyMode() {
    registry.forEach(({ m, base, glowy }) => {
      m.color.copy(base);
      if (lowStim) { m.color.getHSL(hsl); m.color.setHSL(hsl.h, hsl.s * 0.45, Math.min(0.93, hsl.l * 0.92 + 0.07)); }
      if (glowy) m.emissiveIntensity = lowStim ? 0 : 0.55;
    });
    ambient.visible = !lowStim;
    controls.enableDamping = !lowStim;
    objs.forEach(o => { o.glows.forEach(g => { g.m.visible = !lowStim; }); if (lowStim) { o.bodyG.position.y = 0; o.bodyG.rotation.y = 0; o.glow = 0; } });
    if (lowStim) tween = null;
    markDirty();
  }

  /* ----- main loop ----- */
  const v3 = new THREE.Vector3();
  let last = performance.now(), time = 0, offX = 0, offY = 0;
  // Shift the rendered window so the scene is centred in the area NOT covered by the header / panel.
  const panelShift = () => {
    const f = freeArea(), open = !!state.selected;
    return [open ? f.panelW / 2 : 0, ((open ? f.panelH : 0) - HDR) / 2];
  };
  const ease = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  function frame(now) {
    requestAnimationFrame(frame);
    if (textMode) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let needs = !lowStim; // calm mode renders only when something changes
    time += dt;

    if (tween) {
      const k = clamp((now - tween.t0) / tween.dur, 0, 1), e = ease(k);
      camera.position.lerpVectors(tween.p0, tween.p1, e); camera.position.y += Math.sin(Math.PI * k) * tween.arc;
      controls.target.lerpVectors(tween.t0v, tween.t1, e);
      if (k >= 1) tween = null; needs = true;
    }
    if (controls.update()) needs = true;

    objs.forEach(o => {
      const hl = state.hovered === o.d.id || state.focused === o.d.id, sel = state.selected === o.d.id;
      const gTarget = lowStim ? 0 : (sel ? 0.9 : 0) + (hl ? 0.7 : 0), sTarget = (hl || sel) ? 1.05 : 1;
      if (lowStim) { o.glow = 0; o.scale = sTarget; }
      else {
        o.glow += (Math.min(1, gTarget) - o.glow) * Math.min(1, dt * 4); o.scale += (sTarget - o.scale) * Math.min(1, dt * 4);
        o.bodyG.position.y = Math.sin(time * 0.6 + o.phase) * 0.12; o.bodyG.rotation.y = Math.sin(time * 0.25 + o.phase) * 0.06;
        if (o.lm.anim) o.lm.anim(time, dt);
      }
      o.bodyG.scale.setScalar(o.scale);
      o.glows.forEach(g => { g.m.material.opacity = o.glow * g.max; });
      o.labelEl.classList.toggle('hl', hl || sel);
    });
    if (!lowStim) { ambient.rotation.y += dt * 0.004; clouds.rotation.y += dt * 0.01; clouds.children.forEach(c => { c.position.y = c.userData.y0 + Math.sin(time * 0.15 + c.userData.ph) * 0.6; }); }

    // keep the focused island clear of the side panel / bottom sheet
    const [tx, ty] = panelShift(), kk = lowStim ? 1 : Math.min(1, dt * 5);
    const px = offX, py = offY; offX += (tx - offX) * kk; offY += (ty - offY) * kk;
    if (Math.abs(offX - px) > 0.01 || Math.abs(offY - py) > 0.01) needs = true;
    if (Math.abs(offX) > 0.5 || Math.abs(offY) > 0.5) camera.setViewOffset(W, H, offX, offY, W, H); else if (camera.view && camera.view.enabled) camera.clearViewOffset();

    if (needs || dirty) {
      objs.forEach(o => { // project labels
        v3.copy(o.root.position).add(o.lift); v3.y += o.bodyG.position.y; v3.project(camera);
        const vis = v3.z < 1 && Math.abs(v3.x) < 1.3 && Math.abs(v3.y) < 1.3;
        o.labelEl.style.visibility = vis ? 'visible' : 'hidden';
        o.labelEl.style.transform = `translate(${(v3.x * 0.5 + 0.5) * W}px, ${(-v3.y * 0.5 + 0.5) * H}px) translate(-50%, -100%)`;
      });
      renderer.render(scene, camera); dirty = false;
    }
  }

  resize(); camera.position.copy(ovPos()); camera.lookAt(OV_TARGET); controls.target.copy(OV_TARGET); controls.update();
  requestAnimationFrame(t => { last = t; frame(t); });

  return { flyToIsland, flyToOverview, markDirty, applyMode, resize, labelFor: id => objById[id].labelEl };
}

/* =====================================================================
   G. FALLBACKS, HINT, WIRING, START-UP
   ===================================================================== */
function showFallback(msg) {
  $('#loading').hidden = true;
  const f = $('#fallback'); f.hidden = false; f.textContent = msg;
  setTextMode(true, { focus: false, silent: true });
  $('#btnText').disabled = true;
}
let hintTimer = null;
function showHint() {
  if (store('pf_hint')) return;
  const h = $('#hint'); h.hidden = false; h.classList.remove('fade');
  hintTimer = setTimeout(hideHint, 14000);
}
function hideHint() {
  const h = $('#hint'); if (h.hidden) return; clearTimeout(hintTimer);
  store('pf_hint', '1'); h.classList.add('fade'); setTimeout(() => { h.hidden = true; }, 1300);
}

function measureHeader() {
  HDR = $('#topbar').offsetHeight;
  document.documentElement.style.setProperty('--hdr', HDR + 'px');
  if (webgl) webgl.markDirty();
}

function wireUI() {
  $('#btnOverview').addEventListener('click', backToOverview);
  $('#btnClose').addEventListener('click', closePanel);
  $('#hintClose').addEventListener('click', hideHint);
  $('#btnMusic').addEventListener('click', () => { musicWanted = !musicWanted; syncMusic(); });
  $('#vol').addEventListener('input', e => { const v = +e.target.value / 100; Music.setVolume(v); store('pf_vol', String(e.target.value)); });
  $('#btnLow').addEventListener('click', () => setLowStim(!lowStim, true));
  $('#btnText').addEventListener('click', () => setTextMode(!textMode));
  $('#skipLink').addEventListener('click', e => { e.preventDefault(); setTextMode(true); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) { e.preventDefault(); closePanel(); } });
  new ResizeObserver(measureHeader).observe($('#topbar'));
  window.addEventListener('resize', measureHeader);
  document.addEventListener('visibilitychange', () => { if (document.hidden && Music.isOn()) { Music.stop(); musicWanted = false; syncMusic(); } });
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const onMq = () => { if (mq.matches && !lowStim) setLowStim(true, false); };
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  // remembered settings for this session
  const v = store('pf_vol'); if (v != null && v !== '') { $('#vol').value = v; Music.setVolume(+v / 100); }
  const saved = store('pf_low');
  setLowStim(saved === '1' ? true : saved === '0' ? false : mq.matches, false);
}

function start() {
  buildTextList(); wireUI(); measureHeader();
  if (typeof THREE === 'undefined' || !THREE.OrbitControls) { showFallback('The 3D library could not be loaded (you may be offline). No problem: explore every island from the text list below.'); return; }
  try {
    webgl = initScene();
  } catch (err) {
    console.error(err);
    showFallback('Your browser or device cannot show the 3D scene (WebGL is not available). No problem: explore every island from the text list below.');
    return;
  }
  $('#loading').hidden = true;
  webgl.applyMode();
  showHint();
  $('#btnOverview').disabled = false;
}
start();

})();
</script>
