<style>

<body>
<canvas id="c"></canvas>

<script>
'use strict';
/* =====================================================================
   A SUNDAY ON LA GRANDE JATTE — every pixel is an instanced dot of paint.
   Shared pure functions below are also injected into a Web Worker.
   ===================================================================== */

/* ---------- scene layout (shared by the worker generator and the main-thread physics) ---------- */
const LAYOUT={
  // x, z, crown-centre height, crown radius
  trees:[[-40,14,11,5.2],[-17,-12,12.5,3.6],[-31,-30,10,4.4],[36,-14,13,3.9],[8,-29,9.5,3.8],[31,31,9.5,4.4],[-8,37,10,4.6],
         [44,-35,11,4.2],[-44,-9,10.5,4.5],[19,-45,8,3.3],[-24,-46,8.5,3.6],[0,-47,7,3.1],[46,18,9,4.0]],
  // k: kind, a: heading (faces (sin a, cos a)); +x is screen-right in the painting view, a=PI/2 faces right
  people:[
    {k:'recl',x:-19,z:17,a:1.5708},
    {k:'sitW',x:-13,z:15.2,a:1.5708,dress:25,hat:30},
    {k:'dog',x:-8.6,z:16.4,a:-1.5708},
    {k:'sitW',x:-24,z:11.5,a:1.2,dress:31,hat:28},
    {k:'lady',x:-3.4,z:1.6,a:0.25,dress:26,hat:25,para:25},
    {k:'child',x:-2.0,z:2.1,a:-0.1,dress:25,hat:25},
    {k:'lady',x:7,z:-15,a:0.2,dress:25,hat:31,para:31},
    {k:'man',x:-30,z:-18,a:1.0},
    {k:'lady',x:-33,z:-8,a:1.3,dress:27,hat:25,para:null},
    {k:'child',x:-31.4,z:-8.4,a:1.3,dress:25,hat:25},
    {k:'fish',x:-12,z:-52,a:3.14159,dress:31,hat:30},
    {k:'sitW',x:33,z:6,a:-1.5708,dress:27,hat:28,para:27},
    {k:'soldier',x:31.5,z:-3,a:-1.5708},
    {k:'soldier',x:34,z:-5.6,a:-1.5708},
    {k:'lady',x:14,z:-30,a:2.6,dress:31,hat:28,para:26},
    {k:'man',x:22,z:-48,a:-1.2},
    {k:'lady',x:26,z:-47,a:-1.2,dress:25,hat:30,para:25},
    {k:'sitW',x:5,z:24,a:1.4,dress:26,hat:25}
  ],
  boats:[
    {k:'sail',x:-45,z:-98,sc:1.5,a:0.12},{k:'sail',x:22,z:-125,sc:2.0,a:-0.1},{k:'sail',x:58,z:-88,sc:1.2,a:0.2},
    {k:'sail',x:-80,z:-145,sc:2.4,a:0.05},{k:'scull',x:-12,z:-104,sc:1.1,a:0.05},{k:'moor',x:30,z:-62.2,sc:1.0,a:0.3}
  ]
};

/* ---------- terrain height (pure) ---------- */
function terrainH(x,z){
  function ss(a,b,v){var t=(v-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
  return -0.9*ss(-56,-61,z)+1.5*ss(-172,-177,z);
}

/* ---------- world generator: returns buckets of packed strokes ---------- */
function GEN(opt, progress){
  const Q=opt.Q, S=1/Math.sqrt(Q), LMAX=400, R_SKY=2600, WY=-0.9;
  const PI=Math.PI;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd=mulberry32(1884);
  const buckets=new Map();
  function bucket(key,ch,sky){
    let b=buckets.get(key);
    if(!b){b={key:key,ch:ch|0,sky:!!sky,n:0,cap:512,buf:new ArrayBuffer(512*32),mn:[1e9,1e9,1e9],mx:[-1e9,-1e9,-1e9],ml:0};b.f=new Float32Array(b.buf);b.u=new Uint32Array(b.buf);buckets.set(key,b);}
    return b;
  }
  function grow(b){b.cap*=2;const nb=new ArrayBuffer(b.cap*32);new Uint8Array(nb).set(new Uint8Array(b.buf,0,b.n*32));b.buf=nb;b.f=new Float32Array(nb);b.u=new Uint32Array(nb);}
  function s8(v){v=Math.round(v*127);return (v<-127?-127:v>127?127:v)&255;}
  function q16(v){return Math.max(0,Math.min(65535,Math.round(Math.sqrt(Math.max(v,0)/LMAX)*65535)));}
  function put(b,px,py,pz,dx,dy,dz,nx,ny,nz,len,wid,mat,tone,gen,bone,dry,phase,amp){
    if(b.n>=b.cap)grow(b);
    const i=b.n*8,f=b.f,u=b.u;
    f[i]=px;f[i+1]=py;f[i+2]=pz;
    u[i+3]=((s8(dx))|(s8(dy)<<8)|(s8(dz)<<16)|(bone<<24))>>>0;
    tone=tone<0?0:tone>1?1:tone;
    u[i+4]=((s8(nx))|(s8(ny)<<8)|(s8(nz)<<16)|(Math.round(tone*255)<<24))>>>0;
    u[i+5]=(q16(len)|(q16(wid)<<16))>>>0;
    u[i+6]=(mat|(((rnd()*256)|0)<<8)|(gen<<16)|(Math.round(Math.min(1,dry)*255)<<24))>>>0;
    u[i+7]=((Math.round(phase*255))|(Math.round(amp*255)<<8))>>>0;
    if(px<b.mn[0])b.mn[0]=px;if(px>b.mx[0])b.mx[0]=px;
    if(py<b.mn[1])b.mn[1]=py;if(py>b.mx[1])b.mx[1]=py;
    if(pz<b.mn[2])b.mn[2]=pz;if(pz>b.mx[2])b.mx[2]=pz;
    if(len>b.ml)b.ml=len;
    b.n++;
  }
  const cl=(v)=>v<0?0:v>1?1:v;
  const sm=(a,b,v)=>{const t=cl((v-a)/(b-a));return t*t*(3-2*t);};
  /* one pointillist "cell" = 1 large underpaint dab + 2 smaller dabs on top */
  function cellD(b,x,y,z,dx,dy,dz,nx,ny,nz,c,mat,tone,tj,bone,dry,amp){
    const d0=dx*nx+dy*ny+dz*nz;dx-=nx*d0;dy-=ny*d0;dz-=nz*d0;
    const l=Math.hypot(dx,dy,dz)||1;dx/=l;dy/=l;dz/=l;
    const bx=ny*dz-nz*dy,by=nz*dx-nx*dz,bz=nx*dy-ny*dx;
    put(b,x,y,z,dx,dy,dz,nx,ny,nz,c*2.5,c*2.1,mat,tone+(rnd()-.5)*tj,0,bone,dry*0.5,rnd(),amp);
    for(let i=0;i<2;i++){
      const ox=(rnd()-.5)*c*1.5,oy=(rnd()-.5)*c*1.5,a=(rnd()-.5)*1.2,ca=Math.cos(a),sa=Math.sin(a);
      put(b,x+dx*ox+bx*oy,y+dy*ox+by*oy,z+dz*ox+bz*oy,dx*ca+bx*sa,dy*ca+by*sa,dz*ca+bz*sa,nx,ny,nz,c*(i?1.0:1.35),c*(i?0.85:1.15),mat,tone+(rnd()-.5)*tj,i+1,bone,dry,rnd(),amp);
    }
  }
  const norm=(x,y,z)=>{const l=Math.hypot(x,y,z)||1;return [x/l,y/l,z/l];};
  /* flat rectangle of dots */
  function rect(o){
    const b=bucket(o.key,o.ch||0);
    const ux=o.u[0],uy=o.u[1],uz=o.u[2],vx=o.v[0],vy=o.v[1],vz=o.v[2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    const f=o.face;if(f&&nx*f[0]+ny*f[1]+nz*f[2]<0){nx=-nx;ny=-ny;nz=-nz;}
    const c=o.cell*S;
    const nu=Math.max(1,Math.round(o.du/c)),nv=Math.max(1,Math.round(o.dv/c));
    const cu=o.du/nu,cv=o.dv/nv,cc=(cu+cv)*0.5;
    const dxv=o.dir==='v'?o.v:o.u;
    const tf=typeof o.tone==='function';
    for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
      const s=(i+rnd())*cu,t=(j+rnd())*cv;
      const x=o.p[0]+ux*s+vx*t,y=o.p[1]+uy*s+vy*t,z=o.p[2]+uz*s+vz*t;
      if(o.cull&&!o.cull(x,y,z))continue;
      cellD(b,x,y,z,dxv[0],dxv[1],dxv[2],nx,ny,nz,cc,o.mat,tf?o.tone(s,t,x,y,z):(o.tone||0),o.tj||0,o.bone||0,o.dry===undefined?0.35:o.dry,o.amp||0);
    }
  }
  function box(o){
    const x=o.c[0],y=o.c[1],z=o.c[2],hx=o.h[0],hy=o.h[1],hz=o.h[2];
    const base={key:o.key,ch:o.ch,cell:o.cell,mat:o.mat,tone:o.tone,tj:o.tj,bone:o.bone,dry:o.dry,cull:o.cull};
    const mk=(p,u,v,du,dv,face,dir)=>{const r=Object.assign({},base);r.p=p;r.u=u;r.v=v;r.du=du;r.dv=dv;r.face=face;r.dir=dir;rect(r);};
    if(!o.noTop)mk([x-hx,y+hy,z-hz],[1,0,0],[0,0,1],2*hx,2*hz,[0,1,0],hx>=hz?'u':'v');
    mk([x-hx,y-hy,z+hz],[1,0,0],[0,1,0],2*hx,2*hy,[0,0,1],hy>hx?'v':'u');
    mk([x-hx,y-hy,z-hz],[1,0,0],[0,1,0],2*hx,2*hy,[0,0,-1],hy>hx?'v':'u');
    mk([x+hx,y-hy,z-hz],[0,0,1],[0,1,0],2*hz,2*hy,[1,0,0],hy>hz?'v':'u');
    mk([x-hx,y-hy,z-hz],[0,0,1],[0,1,0],2*hz,2*hy,[-1,0,0],hy>hz?'v':'u');
  }
  /* tube between A and B with radius profile */
  function tube(o){
    const b=bucket(o.key,o.ch||0);
    const A=o.A,B=o.B;let ax=B[0]-A[0],ay=B[1]-A[1],az=B[2]-A[2];const L=Math.hypot(ax,ay,az);if(L<1e-6)return;ax/=L;ay/=L;az/=L;
    let rx=0,ry=0,rz=1;if(Math.abs(az)>0.9){rx=1;rz=0;}
    let e1=norm(ay*rz-az*ry,az*rx-ax*rz,ax*ry-ay*rx);
    const e2=[ay*e1[2]-az*e1[1],az*e1[0]-ax*e1[2],ax*e1[1]-ay*e1[0]];
    const c=o.cell*S,rows=Math.max(1,Math.round(L/c)),tf=typeof o.tone==='function';
    for(let i=0;i<rows;i++){
      const t=(i+rnd())/rows;
      const r=o.prof?o.prof(t):(o.r0+(o.r1-o.r0)*t);
      const cols=Math.max(3,Math.round(2*PI*r/c));
      for(let j=0;j<cols;j++){
        const phi=(j+rnd())/cols*2*PI,cp=Math.cos(phi),sp=Math.sin(phi);
        const nx=cp*e1[0]+sp*e2[0],ny=cp*e1[1]+sp*e2[1],nz=cp*e1[2]+sp*e2[2];
        const px=A[0]+ax*L*t+nx*r,py=A[1]+ay*L*t+ny*r,pz=A[2]+az*L*t+nz*r;
        cellD(b,px,py,pz,ax,ay,az,nx,ny,nz,c,o.mat,tf?o.tone(t,phi,py):(o.tone||0),o.tj||0,o.boneOf?o.boneOf(py):(o.bone||0),o.dry===undefined?0.35:o.dry,o.amp||0);
      }
    }
  }
  function ellipsoid(o){
    const b=bucket(o.key,o.ch||0);
    const rx=o.r[0],ry=o.r[1],rz=o.r[2];
    const yw=o.yaw||0,cy_=Math.cos(yw),sy_=Math.sin(yw);
    const p=1.6075,ar=4*PI*Math.pow((Math.pow(rx*ry,p)+Math.pow(rx*rz,p)+Math.pow(ry*rz,p))/3,1/p);
    const c=o.cell*S,n=Math.max(6,Math.round(ar/(c*c))),tf=typeof o.tone==='function';
    for(let i=0;i<n;i++){
      const u1=rnd()*2-1,th=rnd()*2*PI,sq=Math.sqrt(1-u1*u1);
      const qx=sq*Math.cos(th),qy=u1,qz=sq*Math.sin(th);
      const lx=qx*rx,lz=qz*rz;
      const px=o.c[0]+lx*cy_+lz*sy_,py=o.c[1]+qy*ry,pz=o.c[2]-lx*sy_+lz*cy_;
      if(o.cut&&!o.cut(px-o.c[0],py-o.c[1],pz-o.c[2]))continue;
      let nn=norm(qx/rx,qy/ry,qz/rz);
      nn=[nn[0]*cy_+nn[2]*sy_,nn[1],-nn[0]*sy_+nn[2]*cy_];
      const qwx=qx*cy_+qz*sy_,qwz=-qx*sy_+qz*cy_;
      const dd=Math.abs(nn[1])>0.96?[1,0,0]:[-nn[0]*nn[1],1-nn[1]*nn[1],-nn[2]*nn[1]];
      cellD(b,px,py,pz,dd[0],dd[1],dd[2],nn[0],nn[1],nn[2],c,o.mat,tf?o.tone(qwx,qy,qwz):(o.tone||0),o.tj||0,o.bone||0,o.dry===undefined?0.3:o.dry,o.amp||0);
    }
  }
  /* local -> world transform for figures and boats (same convention as the runtime rotY) */
  function mkXf(x,z,ang,sc,y0){
    const ca=Math.cos(ang),sa=Math.sin(ang);y0=y0||0;
    return {x:x,z:z,ang:ang,sc:sc,P:(p)=>[x+sc*(p[0]*ca+p[2]*sa),y0+sc*p[1],z+sc*(-p[0]*sa+p[2]*ca)],D:(p)=>norm(p[0]*ca+p[2]*sa,p[1],-p[0]*sa+p[2]*ca)};
  }
  const ID={x:0,z:0,ang:0,sc:1,P:(p)=>p,D:(p)=>norm(p[0],p[1],p[2])};
  function tubeX(xf,o){
    const sc=xf.sc,oo=Object.assign({},o);oo.A=xf.P(o.A);oo.B=xf.P(o.B);
    if(o.prof)oo.prof=(t)=>sc*o.prof(t);else{oo.r0=o.r0*sc;oo.r1=o.r1*sc;}
    oo.cell=(o.cell||0.03)*Math.max(0.75,sc);tube(oo);
  }
  function ellX(xf,o){
    const sc=xf.sc,oo=Object.assign({},o);oo.c=xf.P(o.c);oo.r=[o.r[0]*sc,o.r[1]*sc,o.r[2]*sc];oo.yaw=xf.ang+(o.yaw||0);
    oo.cell=(o.cell||0.03)*Math.max(0.75,sc);ellipsoid(oo);
  }

  /* ---------- cast shadows: every solid registers spheres, the lawn looks them up ---------- */
  const SUN_EL=26*PI/180,TANE=Math.tan(SUN_EL),SINE=Math.sin(SUN_EL);
  const SDL=Math.hypot(0.985,0.17),SDX=0.985/SDL,SDZ=0.17/SDL;
  const SH=[];
  function addSH(x,y,z,r){const k=y/TANE;SH.push({px:x+SDX*k,pz:z+SDZ*k,a:r/SINE,b:r});}
  function shadowAt(x,z){
    let m=0;
    for(let i=0;i<SH.length;i++){
      const s=SH[i],dx=x-s.px,dz=z-s.pz;
      if(dx*dx+dz*dz>s.a*s.a)continue;
      const u=(dx*SDX+dz*SDZ)/s.a,v=(-dx*SDZ+dz*SDX)/s.b,q=u*u+v*v;
      if(q<1){const w=1-sm(0.5,1,q);if(w>m)m=w;}
    }
    return m;
  }

  /* =================== SKY =================== */
  progress(0.02,'Sky: pale dots of cobalt and cream');
  function tSky(az,el){
    const e=Math.max(el,0)/(PI/2);
    let t=Math.pow(e,0.72)+0.012*Math.sin(5*az+9*e)+0.008*Math.sin(11*az-4*e);
    return t<0?0:t>1?1:t;
  }
  {
    const gens=[[1.5,1.2,1.5],[0.9,0.75,1.4],[0.5,0.42,1.2]];
    const elMin=-6*PI/180,elMax=89*PI/180,sMin=Math.sin(elMin),sMax=Math.sin(elMax);
    const areaDeg=2*PI*(sMax-sMin)*(180/PI)*(180/PI);
    for(let g=0;g<3;g++){
      const lenD=gens[g][0]*S,widD=gens[g][1]*S,cov=gens[g][2];
      const n=Math.round(cov*areaDeg/(gens[g][0]*gens[g][1]*0.7)*Q);
      const len=lenD*PI/180*R_SKY,wid=widD*PI/180*R_SKY;
      for(let i=0;i<n;i++){
        const az=rnd()*2*PI,el=Math.asin(sMin+(sMax-sMin)*rnd());
        const ce=Math.cos(el),se=Math.sin(el),ca=Math.cos(az),sa=Math.sin(az);
        const key='S'+Math.floor(az/(2*PI)*36)+'_'+(el<0.3?0:el<0.7?1:2);
        const b=bucket(key,0,true);

// joystick + buttons

/* ---- camera tour ---- */
const TOUR=[
  {p:[10,2.3,40],t:[2,3.4,-30]},{p:[-9,1.4,24],t:[-15,1.1,13]},{p:[14,1.7,22],t:[22,1.3,9]},{p:[-2,2.0,5],t:[2,1.2,-8]},
  {p:[18,3.0,-42],t:[-10,2.0,-120]},{p:[-34,11,-26],t:[10,3,8]},{p:[0,30,62],t:[4,0,-30]},{p:[34,1.6,-2],t:[0,1.8,-8]}
];
function catmull(a,b,c,d,t){const t2=t*t,t3=t2*t;return 0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);}
function tourAt(u){
  const n=TOUR.length;u=((u%1)+1)%1*n;const i=Math.floor(u),f=u-i;
  const g=k=>TOUR[((i+k)%n+n)%n];
  const P=[0,1,2].map(a=>catmull(g(-1).p[a],g(0).p[a],g(1).p[a],g(2).p[a],f));
  const Tg=[0,1,2].map(a=>catmull(g(-1).t[a],g(0).t[a],g(1).t[a],g(2).t[a],f));
  return {p:P,t:Tg};
}

/* ---- player update ---- */
let lastTime=0,simTime=0,fpsE=60,frameMsE=16,lowT=0,highT=0,drawnStrokes=0;
const WP=[[3,30],[-6,23],[-9,7],[2,-3],[12,-12],[24,-20],[20,-36],[4,-41],[-12,-37],[-26,-26],[-27,-5],[-17,5],[-3,14]];
let wpI=0,stuckT=0,stuckRef={x:0,z:0},wpInit=false;
const NPCP={cx:20,cz:12,rx:9,rz:4.5};
function npcPose(i,t){const th=-1.7+t*0.11-i*0.15,x=NPCP.cx+NPCP.rx*Math.cos(th),z=NPCP.cz+NPCP.rz*Math.sin(th);
  return {x:x,z:z,a:Math.atan2(-NPCP.rx*Math.sin(th),NPCP.rz*Math.cos(th))};}
function updatePlayer(dt){
  const p=PH.pos;
  const lookYaw=cam.yaw;
  let wx=0,wz=0,speed=0,jump=false;
  const fx=Math.cos(lookYaw),fz=Math.sin(lookYaw),rx=-Math.sin(lookYaw),rz=Math.cos(lookYaw);
  if(ctl.auto&&!ctl.tour){
    if(!wpInit){let bi=0,bd=1e9;WP.forEach((w,i)=>{const d=Math.hypot(w[0]-p.x,w[1]-p.z);if(d<bd){bd=d;bi=i;}});wpI=bi;wpInit=true;stuckRef={x:p.x,z:p.z};stuckT=0;}
    const w=WP[wpI],dx=w[0]-p.x,dz=w[1]-p.z,dd=Math.hypot(dx,dz);
    if(dd<1.3){wpI=(wpI+1)%WP.length;}else{wx=dx/dd;wz=dz/dd;speed=3.4;}
    stuckT+=dt;if(stuckT>1.6){if(Math.hypot(p.x-stuckRef.x,p.z-stuckRef.z)<0.5)wpI=(wpI+1)%WP.length;stuckRef={x:p.x,z:p.z};stuckT=0;}
  }else{
    wpInit=false;
    let f=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)-ctl.joy.y;
    let r=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+ctl.joy.x;
    const l=Math.hypot(f,r);if(l>1){f/=l;r/=l;}
    if(l>0.05){wx=fx*f+rx*r;wz=fz*f+rz*r;const m=Math.hypot(wx,wz);wx/=m;wz/=m;speed=(keys['shift']?7.0:3.6)*Math.min(1,l);}
    jump=ctl.jump;
  }
  ctl.jump=false;
  const sm=Math.min(1,dt*9);
  PH.tv=PH.tv||{x:0,z:0};
  PH.tv.x+=(wx*speed-PH.tv.x)*sm;PH.tv.z+=(wz*speed-PH.tv.z)*sm;
  const steps=Math.max(1,Math.ceil(dt/(1/90)));
  for(let i=0;i<steps;i++)phys.step(dt/steps,PH.tv.x,PH.tv.z,i===0&&jump);
  if(PH.grounded){player.last.x=p.x;player.last.z=p.z;}
  if(p.y<-2.5){window.__falls++;phys.teleport(player.last.x,0.95,player.last.z);PH.tv.x=PH.tv.z=0;}
  const sp=Math.hypot(PH.tv.x,PH.tv.z);player.speed=sp;
  if(sp>0.4){const target=Math.atan2(PH.tv.x,PH.tv.z);let d=target-player.heading;d=Math.atan2(Math.sin(d),Math.cos(d));player.heading+=d*Math.min(1,dt*8);player.idle=0;}
  else{player.idle+=dt;if(player.idle>0.8){const tx=cam.pos[0]-p.x,tz=cam.pos[2]-p.z;const target=Math.atan2(tx,tz);let d=target-player.heading;d=Math.atan2(Math.sin(d),Math.cos(d));player.heading+=d*Math.min(1,dt*3);}}
  player.gait+=sp*dt*2.3;
  if(player.screamT>=0){player.screamT+=dt;const t=player.screamT;player.scream=t<1.6?(1-Math.cos(Math.PI*t/1.6))*0.5:0;if(t>1.7)player.screamT=-1;}else player.scream=0;
}

/* ---- camera update ---- */
function updateCamera(dt){
  const p=PH.pos;
  let pos,tgt;
  if(cam.over){pos=cam.over.p;tgt=cam.over.t;cam.pos=pos.slice();cam.yaw=Math.atan2(tgt[2]-pos[2],tgt[0]-pos[0]);return {pos,tgt};}
  if(ctl.tour){tourT+=dt/110;const r=tourAt(tourT);const k=Math.min(1,dt*3);pos=cam.pos.map((v,i)=>v+(r.p[i]-v)*k);tgt=cam.tgt.map((v,i)=>v+(r.t[i]-v)*k);}
  else{
    const head=[p.x,p.y-0.9+1.55,p.z];
    if(ctl.auto){const psi=Math.atan2(PH.tv?PH.tv.z:0,PH.tv?PH.tv.x:autoDir);const base=player.speed>0.5?psi:(autoDir>0?0:Math.PI);
      let target=base+0.45+cam.add;let d=target-cam.alpha;d=Math.atan2(Math.sin(d),Math.cos(d));cam.alpha+=d*Math.min(1,dt*1.6);}
    const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
    const lookYaw=cam.alpha+Math.PI;const rx=-Math.sin(lookYaw),rz=Math.cos(lookYaw);
    const shift=Math.min(1.1,cam.dist*0.2);
    const t2=[head[0]+rx*shift,head[1]-0.1,head[2]+rz*shift];
    let cx=t2[0]+Math.cos(cam.alpha)*cam.dist*cp,cy=t2[1]+sp*cam.dist,cz=t2[2]+Math.sin(cam.alpha)*cam.dist*cp;
    const minY=Math.max(0.45,terrainH(cx,cz)+0.45);
    if(cy<minY)cy=minY;
    const k=Math.min(1,dt*6);
    pos=cam.pos.map((v,i)=>v+([cx,cy,cz][i]-v)*k);tgt=cam.tgt.map((v,i)=>v+(t2[i]-v)*k);
  }
  cam.pos=pos;cam.tgt=tgt;cam.yaw=Math.atan2(tgt[2]-pos[2],tgt[0]-pos[0]);
  return {pos,tgt};
}

/* ---- frustum ---- */
const planes=new Float32Array(24);
function extractPlanes(m){
  const r=(i)=>[m[i],m[4+i],m[8+i],m[12+i]];const r0=r(0),r1=r(1),r2=r(2),r3=r(3);
  const P=[[r3[0]+r0[0],r3[1]+r0[1],r3[2]+r0[2],r3[3]+r0[3]],[r3[0]-r0[0],r3[1]-r0[1],r3[2]-r0[2],r3[3]-r0[3]],
    [r3[0]+r1[0],r3[1]+r1[1],r3[2]+r1[2],r3[3]+r1[3]],[r3[0]-r1[0],r3[1]-r1[1],r3[2]-r1[2],r3[3]-r1[3]],
    [r3[0]+r2[0],r3[1]+r2[1],r3[2]+r2[2],r3[3]+r2[3]],[r3[0]-r2[0],r3[1]-r2[1],r3[2]-r2[2],r3[3]-r2[3]]];
  for(let i=0;i<6;i++){const l=Math.hypot(P[i][0],P[i][1],P[i][2])||1;for(let k=0;k<4;k++)planes[i*4+k]=P[i][k]/l;}
}
function visible(s){for(let i=0;i<6;i++){if(planes[i*4]*s[0]+planes[i*4+1]*s[1]+planes[i*4+2]*s[2]+planes[i*4+3]<-s[3])return false;}return true;}

/* ---- rendering ---- */
const halton=(i,b)=>{let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b);}return r;};
let FOV=1.0;
function renderScene(time,jx,jy){
  const {pos,tgt}=cam._cur;
  const asp=view.cw/view.ch;FOV=asp<1?1.3:1.0;
  const P=M4.persp(FOV,asp,0.15,7000),V=M4.look(pos,tgt,[0,1,0]),VP=M4.mul(P,V);
  extractPlanes(VP);
  gl.bindFramebuffer(gl.FRAMEBUFFER,T.ms);gl.viewport(0,0,view.cw,view.ch);
  gl.colorMask(true,true,true,true);gl.clearColor(0.66,0.80,0.92,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.colorMask(true,true,true,false);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.BLEND);gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.uVP,false,VP);gl.uniform3f(U.uCam,pos[0],pos[1],pos[2]);
  gl.uniform2f(U.uJit,jx*2/view.cw,jy*2/view.ch);
  gl.uniform1f(U.uFocal,view.ch*0.5/Math.tan(FOV/2));gl.uniform1f(U.uTime,time);
  gl.uniform1f(U.uMinPx,0.006*view.ch);gl.uniform1f(U.uMaxPx,0.5*view.ch);
  gl.uniform1f(U.uBristles,tier.b);gl.uniform1f(U.uA2C,T.samples>1?1:0);
  const sh=-1;
  gl.uniform4f(U.uShock,PH.pos.x,PH.pos.y+0.6,PH.pos.z,sh);
  gl.uniform1f(U.uGrass,0);gl.uniform1f(U.uUseBones,0);gl.uniformMatrix4fv(U.uModel,false,M4.ident());
  let drawn=0;
  // opaque-first: characters + static (non-sky), grass, then sky
  const drawB=(b)=>{gl.uniform1ui(U.uSeedBase,b.seed);gl.bindVertexArray(b.vao);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,b.n);drawn+=b.n;};
  // characters
  const heading=player.heading;
  const n0=npcPose(0,time),n1=npcPose(1,time);
  const models=[M4.mul(M4.trans(PH.pos.x,PH.pos.y-0.9,PH.pos.z),M4.rotY(heading)),
                M4.mul(M4.trans(n0.x,0,n0.z),M4.rotY(n0.a)),
                M4.mul(M4.trans(n1.x,0,n1.z),M4.rotY(n1.a))];
  playerPose(boneArr[0],time,Math.min(1,player.speed/3.2),player.gait,player.scream);
  gentlemanPose(boneArr[1],time,time*1.9,0);gentlemanPose(boneArr[2],time,time*1.9,1.7);
  for(const b of batches){
    if(b.sky)continue;
    if(b.ch>0){gl.uniform1f(U.uUseBones,1);gl.uniformMatrix4fv(U.uModel,false,models[b.ch-1]);gl.uniformMatrix4fv(U.uBones,false,boneArr[b.ch-1]);drawB(b);gl.uniform1f(U.uUseBones,0);gl.uniformMatrix4fv(U.uModel,false,M4.ident());}
    else if(visible(b.sph))drawB(b);
  }
  for(const b of batches){if(b.sky&&visible(b.sph))drawB(b);}
  gl.bindVertexArray(null);
  drawnStrokes=drawn;
}
function present(useAcc){
  gl.colorMask(true,true,true,true);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,T.ms);
  if(!useAcc){
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);
    gl.blitFramebuffer(0,0,view.cw,view.ch,0,0,view.cw,view.ch,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  }else{
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,T.res);
    gl.blitFramebuffer(0,0,view.cw,view.ch,0,0,view.cw,view.ch,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER,T.acc);gl.viewport(0,0,view.cw,view.ch);
    gl.disable(gl.DEPTH_TEST);gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    gl.useProgram(fsq);gl.bindVertexArray(fsqVAO);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,T.resT);gl.uniform1i(gl.getUniformLocation(fsq,'t'),0);
    if(photo.n===0){gl.disable(gl.BLEND);}else{gl.enable(gl.BLEND);gl.blendColor(0,0,0,1/(photo.n+1));gl.blendFunc(gl.CONSTANT_ALPHA,gl.ONE_MINUS_CONSTANT_ALPHA);}
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,view.cw,view.ch);
    gl.bindTexture(gl.TEXTURE_2D,T.accT);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

function drawFrame(time,opts){
  opts=opts||{};
  let jx=0,jy=0,acc=false;
  if(photo.on||opts.accum){const i=photo.n+1;jx=halton(i,2)-0.5;jy=halton(i,3)-0.5;acc=true;}
  renderScene(time,jx,jy);
  present(acc);
  if(acc)photo.n++;
}

/* ---- main loop ---- */
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-lastTime)/1000||0.016);lastTime=ts;
  if(!batches.length)return;
  const frozen=photo.on&&photo.n>0;
  if(!frozen){simTime+=dt;updatePlayer(dt);}
  if(photo.on&&photo.n>=photo.max){return;}
  const c=updateCamera(frozen?0:dt);cam._cur=c;
  const t0=performance.now();
  if(!frozen&&photo.on)photo.n=0;
  drawFrame(simTime);
  // adaptive resolution
  if(!photo.on){
    const ms=dt*1000;frameMsE+=(ms-frameMsE)*0.08;
    if(frameMsE>23){lowT+=dt;highT=0;}else if(frameMsE<12.5){highT+=dt;lowT=0;}else{lowT=highT=0;}
    if(lowT>1.0&&renderScale>0.5){renderScale=Math.max(0.5,renderScale*0.88);lowT=0;resize(true);}
    else if(highT>4&&renderScale<1){renderScale=Math.min(1,renderScale*1.07);highT=0;resize(true);}
  }
  hudTick(dt);
}
let hudT=0;
function hudTick(dt){
  fpsE+=((1/dt)-fpsE)*0.05;hudT+=dt;if(hudT<0.3)return;hudT=0;
  $('hud').textContent=`FPS ${fpsE.toFixed(0)}  ·  Resolution ${view.cw}×${view.ch} (×${renderScale.toFixed(2)})\nStrokes ${(drawnStrokes/1000).toFixed(0)}k / ${(totalStrokes/1000).toFixed(0)}k   Quality ${tierName}\nPhysics ${PH.name}  ·  ${ctl.tour?'Camera tour':ctl.auto?'Auto-walk':'Manual'}${photo.on?'  ·  Accumulating '+photo.n+'/'+photo.max:''}`;
}

  resize(true);

const PRESETS={
  wide:{p:[10,2.3,40],t:[2,3.4,-30],pl:[-1,8,0]},
  group:{p:[-9,1.5,24],t:[-15,1.1,13],pl:[-3.4,6,0]},
  couple:{p:[14,1.7,22],t:[22,1.3,9],pl:[2,10,0]},
  river:{p:[10,2.5,-44],t:[-5,2,-120],pl:[10,-30,0]},
  sky:{p:[0,2,10],t:[0,60,-300],pl:[0,10,0]},
  aerial:{p:[-10,30,62],t:[5,0,-30],pl:[0,10,0]},
  hero:{p:null,t:null,pl:[-1,8,0.3]},
  close:{p:[-2.2,1.0,6.8],t:[-3.2,1.2,1.8],pl:[3,12,0]}
};
window.__shot=async function(id,frames){
  const pr=PRESETS[id];
  if(id==='tour'){setTour(true);tourT=0.3;cam.over=null;}
  else{setTour(false);setAuto(false);ctl.tour=false;
    if(pr){ if(pr.pl){phys.teleport(pr.pl[0],0.95,pr.pl[1]);player.heading=pr.pl[2];PH.tv={x:0,z:0};}
      cam.over=pr.p?{p:pr.p.slice(),t:pr.t.slice()}:null;
      if(!pr.p){cam.alpha=Math.PI+0.45;cam.add=0;cam.dist=4.8;cam.pitch=0.14;}}}
  photo.on=false;if(pr&&pr.scream!==undefined)window.__scream(pr.scream);else window.__scream(-1);
  for(let i=0;i<4;i++){await new Promise(r=>requestAnimationFrame(r));}
  const c=updateCamera(0.5);cam._cur=c;
  photo.n=0;const n=frames||6;
  for(let i=0;i<n;i++){drawFrame(simTime,{accum:true});}
  return canvas.toDataURL('image/png');
};
window.__shotCam=async function(p,t,n){setTour(false);setAuto(false);photo.on=false;cam.over={p:p,t:t};window.__scream(-1);for(let i=0;i<3;i++)await new Promise(r=>requestAnimationFrame(r));cam._cur=updateCamera(0.5);photo.n=0;for(let i=0;i<(n||1);i++)drawFrame(simTime,{accum:true});return canvas.toDataURL('image/png');};
window.__stats=()=>({tier:tierName,strokes:totalStrokes,drawn:drawnStrokes,batches:batches.length,res:[view.cw,view.ch],phys:PH.name,renderer:RENDERER,fps:fpsE,scale:renderScale,accFloat:T.accFloat,samples:T.samples});
window.__ready=false;window.__falls=0;window.__scream=(t)=>{player.screamT=t;player.scream=t<0.25?t/0.25:Math.max(0,1-(t-0.9)/1.3);};window.__sim=(n,dt)=>{const out={minx:1e9,maxx:-1e9};for(let i=0;i<n;i++){updatePlayer(dt);out.minx=Math.min(out.minx,PH.pos.x);out.maxx=Math.max(out.maxx,PH.pos.x);}out.falls=window.__falls;out.x=PH.pos.x;return out;};window.__ph=()=>({x:PH.pos.x,y:PH.pos.y,z:PH.pos.z,g:PH.grounded,auto:ctl.auto,falls:window.__falls,sp:player.speed,hd:player.heading});

(async function start(){
  $('lt').textContent='Probing GPU performance…';
  await new Promise(r=>setTimeout(r,30));
  const pt=pickTier();tierName=pt.name;tier=TIERS[tierName];
  if(pt.ms>=0)$('lt').textContent='GPU benchmark '+pt.ms.toFixed(1)+' ms → '+tierName;
  $('sTier').firstElementChild.textContent='Quality: auto ('+tierName+')';
  resize(true);
  await buildWorld(tierName);
  // start in the "painting pose": figure walks toward the viewer's side of the bridge
  phys.teleport(-1,0.95,9);PH.tv={x:0,z:0};player.heading=Math.PI;
  cam.alpha=Math.PI/2+0.45;cam.pos=[-3,2.2,16];cam.tgt=[-1,1.5,9];
  window.__ready=true;
  setTimeout(()=>{$('help').style.opacity=0.0;},14000);
  requestAnimationFrame(frame);
})();
</script>
